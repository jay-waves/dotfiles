# Windows: %APPDATA%\alacritty\alacritty.toml
# Linux: ~/.config/alacritty/alacritty.toml
# git clone https://github.com/alacritty/alacritty-theme --depth 1

[general]
live_config_reload = true
import = [
	"./alacritty-theme/themes/base16_default_dark.toml"
]
# working_directory = "D:\\"

[window]
startup_mode = "Windowed"
dynamic_padding = true
padding = { x = 8, y = 8 }
decorations_theme_variant = "Dark"
dimensions = { columns = 110, lines = 60 }

opacity = 0.92

[font]
size = 12.5
offset = { x = 0, y = 1 }
# alacritty donnot support ligature or variable fonts

[font.normal]
family = "Maple Mono NF CN"
style = "SemiBold"

[font.bold]
family = "Maple Mono NF CN"
style = "Bold"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600
thickness = 0.18

[scrolling]
history = 20000
multiplier = 3

[mouse]
hide_when_typing = true

# [terminal]
# shell = { program = "pwsh.exe", args = ["-NoLogo"] } # windows only

# use Ctrl + Shift + Space to enter the vi mode

