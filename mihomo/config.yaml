# 配置的关键部分
# - 局域网及端口
# - DNS
# - 代理节点, 及订阅
# - 策略组: 配置选择/负载均衡/延迟测试
# - 规则集: rules

external-controller: 127.0.0.1:9090
secret: 
external-ui: "C:/Users/jay-waves/AppData/Local/mihomo/ui"

allow-lan: true
mixed-port: 7890

mode: rule # 规则匹配. golbal: 全局代理, direct: 全局直连.

log-level: error

ipv6: false
tcp-concurrent: false # 解析出多个 IP 并行尝试
keep-alive-interval: 15

tun:
  enable: false
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  # dns-hijack: - any: 53
  #
sniffer:
  enable: false

dns:
  enable: true
  listen: "0.0.0.0:53"
  enhanced-mode: fake-ip
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 202.112.128.51 # ns.lib.buaa.edu.cn 北航内网把所有 53 端口都封了，阿西吧 
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "*.buaa.edu.cn": 202.112.128.51
  fake-ip-filter:
    - "gw.buaa.edu.cn"
    - "*.feishu.cn"
    - "*.feishucdn.com"
    - "*.ibytedapm.com"
    - "*.feishu.net"
    - "*.feishucdn.com"
    - "*.feishupkg.com"
    - "*.larkoffice.com"
    - "*.bytedance.com"
    - "*.jay-waves.cn"

google-test-template: &google-test-template
  type: http 
  use-system-proxy: false 
  interval:  86400 
  health-check:
    enable: true 
    url: https://www.gstatic.com/generate_204
    interval: 600 
    timeout: 3000 
    lazy: false
    expected-status: 204

proxy-providers:
  rabbit:
    <<: *google-test-template
    url: 
    path: ./proxies/rabbit.yaml
    override:
      additional-prefix: "R "

  sakuracat:
    <<: *google-test-template
    url: 
    path: ./proxies/sakuracat.yaml
    override:
      additional-prefix: "S "

  # curl -L -A 'Clash Verge/1.7.7' 'https://lancdn.yhui0g.com/app/status/new?token=540e98e' --compressed -o lanhai-0615.yaml
  # fuck lanhai 
  # user-agent: "Clash Verge/1.7.7"

  ai:
    type: http 
    path: ./proxies/ai.yaml # use lanhai
    url: 
    filter: "(?i)(美国|美國|US|USA|United States|日本|JP|Japan|新加坡|SG|Singapore|台湾|台灣|TW|Taiwan|韩国|韓國|KR|Korea)"
    exclude-filter: "(?i)港|香港|hk|hongkong|hong kong|澳门|澳門|MO|Macao|Macau"
    interval: 86400

    health-check:
      enable: true 
      expected-status: 401
      url: "https://api.openai.com/v1/models"
      interval: 900
      timeout: 3000
      lazy: false

proxy-groups:
  - name: RABBIT 
    type: url-test 
    use: [rabbit] # use 引入的节点，不会被 url-test 里指定的 url 检测
    interval: 300  # 每 300s 排序一次 health-check 结果
    lazy: true 
    tolerance: 50 

  - name: SAKURA
    type: select
    use: [sakuracat] 

  - name: AI
    type: url-test
    use: [ai]
    lazy: true
    interval: 300
    tolerance: 50

  - name: GLOBAL
    type: select
    proxies:
      - DIRECT
      - RABBIT
      - SAKURA

rule-providers:
    reject-adobe:
      type: file
      behavior: domain
      path: ./rules/reject-adobe.yaml

    openai:
      type: http
      behavior: classical
      url: "https://raw.githubusercontent.com/G4free/clash-ruleset/main/ruleset/ChatGPT.yaml"
      path: ./rules/ChatGPT.yaml
      interval: 86400

    reject:
      type: http
      behavior: domain
      url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
      path: ./rules/reject.yaml
      interval: 86400

    icloud:
      type: http
      behavior: domain
      url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
      path: ./rules/icloud.yaml
      interval: 86400

    proxy:
      type: http
      behavior: domain
      url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
      path: ./rules/proxy.yaml
      interval: 86400

    direct:
      type: http
      behavior: domain
      url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
      path: ./rules/direct.yaml
      interval: 86400

    private:
      type: http
      behavior: domain
      url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
      path: ./rules/private.yaml
      interval: 86400

    telegramcidr:
      type: http
      behavior: ipcidr
      url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
      path: ./rules/telegramcidr.yaml
      interval: 86400

    microsoft:
      type: http
      behavior: domain
      url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.yaml"
      path: ./rules/ms.yaml
      interval: 86400

rules:
  - DOMAIN-SUFFIX,jay-waves.cn,DIRECT
  - DOMAIN-SUFFIX,buaa.edu.cn,DIRECT
  - DOMAIN-SUFFIX,buaa.edu.cn,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,apple,GLOBAL
  - GEOSITE,CN,DIRECT
  - RULE-SET,reject-adobe,REJECT
  # Binance, ChatGPT: No Hong Kong
  - DOMAIN-SUFFIX,binance.com,AI
  - DOMAIN-SUFFIX,binance.us,AI 
  - DOMAIN-SUFFIX,binancecnt.com,AI
  - RULE-SET,openai,AI
  - DOMAIN-SUFFIX,oaiusercontent.com,AI
  - RULE-SET,icloud,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,proxy,GLOBAL
  - RULE-SET,direct,DIRECT
  - RULE-SET,telegramcidr,GLOBAL
  - RULE-SET,microsoft,GLOBAL
  - MATCH,GLOBAL

